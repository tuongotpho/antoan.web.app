# Push lên nhánh main là tự động kiểm tra rồi deploy TOÀN BỘ lên Firebase:
# hosting, firestore rules, storage rules và cloud functions.
#
# TRƯỚC ĐÂY workflow chỉ deploy hosting, còn rules và functions phải chạy tay.
# Vì lệnh chạy tay không ghi rõ project nên nó lấy mặc định trong .firebaserc —
# đã có lần nạp rules vào đúng project mặc định nhưng app lại chạy ở project
# khác, rules sửa xong mà không bao giờ có hiệu lực. Nay mọi thứ đi cùng một
# đường, và project được ghi rõ ở một chỗ duy nhất (biến PROJECT_ID bên dưới).
name: Kiểm tra và deploy (antoan.web.app)

on:
  push:
    branches: [main]
  # Cho phép bấm chạy tay từ tab Actions
  workflow_dispatch:

# Nếu push liên tiếp, huỷ lượt chạy cũ để không deploy chồng nhau
concurrency:
  group: deploy-antoan
  cancel-in-progress: true

env:
  # Project Firebase thật của app. Đổi project thì sửa DUY NHẤT ở đây,
  # rồi sửa cho khớp trong services/firebaseConfig.ts và .firebaserc.
  PROJECT_ID: atld-connect

jobs:
  # ───────────────────────────────────────────────────────────────
  # Cửa kiểm tra: hỏng ở đây thì KHÔNG deploy.
  # ───────────────────────────────────────────────────────────────
  kiem-tra:
    name: Kiểm tra mã nguồn
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Firestore emulator chạy trên Java. Khai báo rõ để không phụ thuộc vào
      # việc máy chạy CI tình cờ có sẵn bản Java nào.
      - name: Cài Java (cho Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài dependencies
        run: npm ci

      - name: Soát lỗi mã nguồn (lint)
        run: npm run lint

      - name: Chạy test
        run: npx vitest run --exclude test/firestoreRules.test.ts

      # Kiểm firestore.rules trên emulator TRƯỚC khi nạp lên máy chủ thật.
      # Từ nay rules được deploy tự động, nên một dòng rules sai có thể khoá
      # sạch cả app — bước này là chốt chặn cuối cùng.
      - name: Kiểm firestore.rules trên emulator
        run: npm run test:rules

  # ───────────────────────────────────────────────────────────────
  # Deploy: chỉ chạy khi cửa kiểm tra đã qua.
  # ───────────────────────────────────────────────────────────────
  deploy:
    name: Build và deploy
    needs: kiem-tra
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cài dependencies
        # npm ci đọc package-lock.json — cài đúng phiên bản đã khoá, nhanh và
        # lặp lại được. Khác với npm install, nó không tự sửa lock file.
        run: npm ci

      - name: Tính ký hiệu phiên bản theo ngày (giờ Việt Nam)
        id: ver
        # Runner chạy giờ UTC, nên ép TZ về Việt Nam để bản deploy lúc rạng sáng
        # không bị đánh số của ngày hôm trước. Bỏ số 0 ở đầu ngày/tháng cho khớp
        # quy ước đang dùng: 6/8/26 -> 6826.
        run: |
          VER=$(TZ=Asia/Ho_Chi_Minh date +'%-d%-m%y')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "Phiên bản phát hành: ver.$VER"
          echo "### Đã deploy \`ver.$VER\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
          # Các khoá này công khai theo thiết kế. Để trống secret cũng chạy được:
          # mã sẽ dùng giá trị dự phòng trong services/firebaseConfig.ts.
          # NHƯNG nếu đã đặt secret thì phải trỏ đúng project trong PROJECT_ID,
          # nếu không bản build sẽ nối vào project khác với nơi nạp rules.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # Cảnh báo sớm nếu secret trỏ nhầm project: bản build sẽ nối vào một nơi,
      # còn rules lại được nạp vào nơi khác — đúng cái bẫy đã mắc phải một lần.
      - name: Kiểm bản build có nối đúng project không
        run: |
          if grep -rq "$PROJECT_ID" dist/assets/*.js; then
            echo "✅ Bản build nối vào project $PROJECT_ID"
          else
            echo "::error::Bản build KHÔNG trỏ tới $PROJECT_ID. Kiểm lại các secret VITE_FIREBASE_* trong GitHub, hoặc giá trị dự phòng trong services/firebaseConfig.ts."
            exit 1
          fi

      - name: Chuẩn bị khoá service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # Ghi qua biến môi trường chứ không nhúng thẳng secret vào dòng lệnh,
        # để nội dung khoá không lọt vào log hay bị shell diễn giải.
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Thiếu secret FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Deploy hosting, rules và functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        # Deploy tất cả trong MỘT lệnh, có ghi rõ --project để không bao giờ
        # phụ thuộc vào project mặc định của .firebaserc nữa.
        # Target "main" trỏ site "antoan"; site atld-connect không bị đụng tới.
        run: |
          npx firebase-tools@14 deploy \
            --only hosting:main,firestore:rules,storage,functions \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force

      - name: Xoá khoá service account
        # Chạy cả khi bước trên hỏng, để khoá không nằm lại trên máy chạy CI.
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
